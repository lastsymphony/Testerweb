<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <title>Aditya Jatayu</title>

  <!-- WhatsApp / Facebook Open Graph -->

  <meta property="og:title" content="Aditya Jatayu">
  <meta property="og:description" content="Personal page Aditya Jatayu.">
  <meta property="og:image" content="https://uploader.last.web.id/fd0e04b8d6b66553.jpg">
  <meta property="og:image:secure_url" content="https://uploader.last.web.id/fd0e04b8d6b66553.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- URL halaman -->
  <meta property="og:url" content="https://domain-kamu.com/">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Aditya Jatayu">
  <meta name="twitter:description" content="Personal page Aditya Jatayu.">
  <meta name="twitter:image" content="https://uploader.last.web.id/fd0e04b8d6b66553.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #1e293b, #020617 60%);
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      background: rgba(15,23,42,.8);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      backdrop-filter: blur(15px);
    }

    .avatar {
      width: 130px;
      height: 130px;
      margin: 0 auto 20px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      padding: 14px 20px;
      margin-top: 12px;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      background: #2563eb;
      transition: .2s;
    }

    .button:hover {
      background: #3b82f6;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 25px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="avatar"
      src="https://uploader.last.web.id/fd0e04b8d6b66553.jpg"
      alt="Aditya Jatayu"
    >

    <h1>Aditya Jatayu</h1>

    <p>
      Personal page, portfolio, projects, and digital interests.
    </p>

    <a class="button" href="#" target="_blank">
      Portfolio
    </a>

    <a class="button" href="#" target="_blank">
      Contact
    </a>

    <footer>
      © 2026 Aditya Jatayu
    </footer>

  </main>

</body>
</html>
