<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JASA SEDOT KONTOL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- Animasi Background --- */
        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.3); }
        }

        /* --- Kartu Utama --- */
        .profile-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 24px;
            width: 400px;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 2;
            animation: floatCard 6s infinite ease-in-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px) rotateX(2deg) rotateY(2deg);
            box-shadow: 0 30px 60px rgba(99, 102, 241, 0.2);
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- Avatar --- */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 1.5rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1e293b;
            position: relative;
            z-index: 2;
        }

        .avatar-ring {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #6366f1, #a855f7, #ec4899);
            z-index: 1;
            animation: rotateRing 4s linear infinite;
        }

        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }

        /* --- Teks Typing --- */
        .typing-text {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #6366f1;
            width: 100%;
            animation: typing 3.5s steps(20, end) infinite, blink 0.75s step-end infinite;
        }

        .typing-text span {
            color: #6366f1;
        }

        @keyframes typing {
            0%, 90%, 100% { width: 0; }
            30%, 60% { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #6366f1; }
        }

        /* --- Bio --- */
        .bio {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* --- Skill Tags --- */
        .skills-container {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .skill-tag {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
            cursor: default;
        }

        .skill-tag:hover {
            background: #6366f1;
            color: #fff;
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        /* --- Tombol --- */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* Tombol WhatsApp Hijau */
        .btn-primary {
            background-color: #25D366 !important;
            color: #ffffff !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-primary:hover {
            background-color: #128C7E !important;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
            transform: translateY(-2px);
        }

        .btn-primary svg {
            fill: #ffffff;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .btn-secondary {
            background: transparent;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="profile-card">
        <!-- Avatar -->
        <div class="avatar-container">
            <div class="avatar-ring"></div>
            <img src="https://files.catbox.moe/n3r11g.jpg" alt="Foto Profil" class="avatar">
        </div>

        <!-- Nama -->
        <h1 class="typing-text"><span>Mario Kontol Cilik 😎</span></h1>

        <!-- Bio -->
        <p class="bio">
            Saya seorang colikiawan saya sering cowli 3x sehari menggunakan batang sabun.
        </p>

        <!-- Skills -->
        <div class="skills-container">
            <span class="skill-tag">NGOCOK</span>
            <span class="skill-tag">PMO</span>
            <span class="skill-tag">PENYEPONG</span>
            <span class="skill-tag">JOKI NGENTOT</span>
        </div>

        <!-- Tombol WhatsApp -->
        <div class="button-group">
            <a href="https://wa.me/6285165085786" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                </svg>
                WhatsApp
            </a>
        </div>
    </div>

</body>
</html>
